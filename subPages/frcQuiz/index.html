<!DOCTYPE html>
<html>
    <head>
        <title>Unofficial FRC Team Quiz Website</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <script src="jquery-3.7.1.min.js"></script>
        <script src="jquerycode.js"></script>
        <script src="script.js" type="module"></script>
        <center><h1 class="title">Unofficial FRC Team Quiz Website</h1></center>
        <button id="testResponse" class="hidden">Test Response</button>
        <center>
            <br>
            <div class="quiz_setup">
                <h2 class="preset_text">Quiz Settings</h2>
                <label for="year" class="preset_text">Competition Year: </label>
                <input type="number" value=2024 id="year" name="year"><br>
                <label for="minRange" class="preset_text">Team Number Range Min: </label>
                <input type="number" value=0 id="rangeMin" name="minRange"><br>
                <label for="maxRange" class="preset_text">Team Number Range Max: </label>
                <input type="number" value=999 id="rangeMax" name="maxRange"><br>
                <label for="question" class="preset_text">Question Amount: </label>
                <input type="number" value=20 id="questions" name="question"><br>
                <br>
                <button class="button_new button_lightmode" id="create">Create Quiz with Settings</button><br>
                <div class="error hidden" id="errors"></div>
                <a class="button_new hidden button_lightmode" id="start" href="question.html">Start Quiz</a>
            </div>
        </center>
        <div class="footer">
            <center>
                <p><b>Powered by The Blue Alliance Web Api</b></p>
            </center>
        </div>
    </body>
</html>
